<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday, my love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blush: #ffe3ea;
    --petal: #ffb3c6;
    --rose: #e0425f;
    --wine: #7a1f3d;
    --paper: #fffafb;
    --ink: #5a2a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Quicksand', system-ui, sans-serif;
    color: var(--ink);
    background: var(--blush);
    min-height: 100vh;
    overflow-x: hidden;
  }
  h1, h2, .script { font-family: 'Caveat', cursive; font-weight: 700; color: var(--wine); }

  /* floating hearts in the background */
  .bg-hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .bg-hearts span {
    position: absolute; bottom: -40px; color: var(--petal); opacity: .6;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    to { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
  }

  /* ---------- Stage 1: envelope ---------- */
  #stage-envelope {
    position: relative; z-index: 1;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 36px;
    padding: 24px; text-align: center;
    transition: opacity .8s ease, transform .8s ease;
  }
  #stage-envelope.gone { opacity: 0; transform: scale(.96); pointer-events: none; }
  #stage-envelope h1 { font-size: clamp(2.2rem, 8vw, 3.4rem); }
  .hint { font-size: 1rem; animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }

  .envelope {
    position: relative; width: min(320px, 82vw); aspect-ratio: 8 / 5.2;
    cursor: pointer; background: none; border: 0; font: inherit;
    filter: drop-shadow(0 14px 18px rgba(122,31,61,.22));
  }
  .envelope:focus-visible { outline: 3px solid var(--wine); outline-offset: 10px; border-radius: 8px; }
  .env-back { position: absolute; inset: 0; background: #f48fa8; border-radius: 8px; }
  .env-letter {
    position: absolute; left: 8%; right: 8%; top: 8%; bottom: 8%;
    background: var(--paper); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Caveat', cursive; font-size: 1.7rem; color: var(--wine);
    transition: transform .9s cubic-bezier(.3,.9,.3,1) .5s;
  }
  .env-front {
    position: absolute; inset: 0; border-radius: 8px;
    background: #ee7c99;
    clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);
  }
  .env-flap {
    position: absolute; left: 0; right: 0; top: 0; height: 56%;
    background: #e8607f; border-radius: 8px 8px 0 0;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top; transition: transform .6s ease, z-index 0s .3s;
    z-index: 3;
  }
  .env-seal {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--rose); color: #fff; z-index: 4;
    display: grid; place-items: center; font-size: 1.3rem;
    box-shadow: 0 3px 6px rgba(0,0,0,.25);
    transition: opacity .3s;
  }
  .envelope.open .env-flap { transform: rotateX(180deg); z-index: 0; }
  .envelope.open .env-seal { opacity: 0; }
  .envelope.open .env-letter { transform: translateY(-62%); }

  /* ---------- Stage 2: the content ---------- */
  #stage-content { position: relative; z-index: 1; display: none; }
  #stage-content.show { display: block; }
  .reveal { opacity: 0; transform: translateY(14px); transition: opacity .9s ease, transform .9s ease; }
  .reveal.in { opacity: 1; transform: none; }

  .letter-card {
    max-width: 560px; margin: 0 auto; padding: 56px 24px 24px;
  }
  .paper {
    background: var(--paper); border-radius: 14px; padding: 38px 30px;
    box-shadow: 0 10px 30px rgba(122,31,61,.15);
    border-top: 6px solid var(--rose);
  }
  .paper { text-align: center; }
  .paper h2 { font-size: 2.6rem; margin-bottom: 22px; }
  .paper p { line-height: 1.85; margin-bottom: 22px; font-size: 1.05rem; }
  .paper p.finale { font-family: 'Caveat', cursive; font-size: 1.7rem; line-height: 1.5; color: var(--wine); margin-bottom: 0; }
  .paper .sign { font-family: 'Caveat', cursive; font-size: 1.9rem; color: var(--wine); margin-top: 22px; margin-bottom: 0; }

  .next-btn { display: block; margin: 28px auto 0; }

  .btn {
    font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 1.05rem;
    background: var(--rose); color: #fff; border: 0; border-radius: 999px;
    padding: 14px 28px; cursor: pointer;
    box-shadow: 0 6px 0 #b02446;
    transition: transform .12s, box-shadow .12s;
  }
  .btn:hover { transform: translateY(2px); box-shadow: 0 4px 0 #b02446; }
  .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #b02446; }
  .btn:focus-visible { outline: 3px solid var(--wine); outline-offset: 4px; }

  /* gallery */
  .gallery-wrap { max-width: 980px; margin: 0 auto; padding: 50px 20px 10px; text-align: center; }
  .gallery-wrap h2 { font-size: 2.8rem; margin-bottom: 8px; }
  .gallery-wrap > p { margin-bottom: 36px; }
  .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; }
  .polaroid {
    background: #fff; padding: 12px 12px 18px; width: min(260px, 80vw);
    box-shadow: 0 8px 20px rgba(122,31,61,.2);
    transition: transform .3s ease;
  }
  .polaroid:nth-child(odd) { transform: rotate(-3deg); }
  .polaroid:nth-child(even) { transform: rotate(2.5deg); }
  .polaroid:hover { transform: rotate(0) scale(1.04); z-index: 2; }
  .polaroid img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; background: var(--blush); }
  .polaroid figcaption { font-family: 'Caveat', cursive; font-size: 1.5rem; color: var(--wine); margin-top: 12px; }

  /* surprise */
  .surprise { text-align: center; padding: 70px 20px 110px; }
  .surprise h2 { font-size: 2.4rem; margin-bottom: 20px; }

  /* ---------- Rose overlay ---------- */
  #rose-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: radial-gradient(circle at 50% 40%, #5c1530, #2b0716 75%);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; text-align: center; overflow: hidden;
  }
  #rose-overlay.show { display: flex; }
  .close-x {
    position: absolute; top: 16px; right: 16px; z-index: 3;
    background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 50%;
    width: 44px; height: 44px; font-size: 1.3rem; cursor: pointer;
  }
  .close-x:focus-visible { outline: 3px solid #fff; }
  #rose-svg { width: min(300px, 70vw); height: auto; overflow: visible; position: relative; z-index: 2; }
  .rose-msg {
    font-family: 'Caveat', cursive; color: #ffd6e0; font-size: clamp(1.8rem, 6vw, 2.6rem);
    margin-top: 6px; opacity: 0; position: relative; z-index: 2;
  }
  #rose-overlay.show .rose-msg { animation: fadeIn 1.6s ease 3.6s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }

  /* rose drawing animation */
  .stem { stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw 1.6s ease forwards; }
  .leaf { transform-box: fill-box; transform-origin: 0% 100%; transform: scale(0); animation: pop .8s cubic-bezier(.3,1.6,.5,1) forwards; }
  .leaf.l { transform-origin: 100% 100%; }
  .petal { transform-box: fill-box; transform-origin: 50% 100%; transform: scale(0); animation: pop .9s cubic-bezier(.3,1.5,.5,1) forwards; }
  .bud { transform-box: fill-box; transform-origin: 50% 50%; transform: scale(0); animation: pop .8s cubic-bezier(.3,1.6,.5,1) forwards; }
  .bloom { animation: sway 4s ease-in-out 4s infinite; transform-origin: 100px 160px; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop { to { transform: scale(1); } }
  @keyframes sway { 50% { transform: rotate(2.5deg); } }

  /* falling petals + confetti hearts */
  .fall {
    position: absolute; top: -30px; pointer-events: none; z-index: 1;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) translateX(var(--dx)) rotate(var(--rot)); }
  }

  @media (prefers-reduced-motion: reduce) {
    .bg-hearts, .hint { display: none; }
    .stem, .leaf, .petal, .bud { animation-duration: .01s; animation-delay: 0s !important; }
    .bloom { animation: none; }
    .reveal { transition: none; }
  }
</style>
</head>
<body>

<div class="bg-hearts" id="bgHearts" aria-hidden="true"></div>

<!-- STAGE 1 -->
<section id="stage-envelope">
  <h1>A little something for you</h1>
  <button class="envelope" id="envelope" aria-label="Open the envelope">
    <div class="env-back"></div>
    <div class="env-letter" id="envLetterText"></div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="env-seal" aria-hidden="true">♥</div>
  </button>
  <p class="hint" id="hint">Tap the envelope to open it</p>
</section>

<!-- STAGE 2 -->
<main id="stage-content">
  <section class="letter-card">
    <div class="paper reveal" id="paper">
      <h2 id="letterTitle"></h2>
      <div id="letterBody"></div>
    </div>
  </section>

  <section class="gallery-wrap">
    <div class="gallery" id="gallery"></div>
  </section>

  <section class="surprise">
    <h2>One more thing…</h2>
    <button class="btn" id="surpriseBtn">Press for your surprise</button>
  </section>
</main>

<!-- ROSE -->
<div id="rose-overlay" role="dialog" aria-label="A rose for you">
  <button class="close-x" id="closeRose" aria-label="Close">✕</button>
  <svg id="rose-svg" viewBox="0 0 200 300" aria-hidden="true"></svg>
  <p class="rose-msg" id="roseMsg"></p>
</div>

<script>
/* =====================================================
   EDIT THIS PART — everything personal lives here
   ===================================================== */
const CONFIG = {
  envelopeText: "For you",       // small text on the letter inside the envelope

  title: "happy birthdayyyy 🥹💓",

  // Each group of lines is one verse. The last verse is shown in a bigger handwritten style.
  verses: [
    [
      "to the one who makes my little world",
      "feel a little more magical ✨"
    ],
    [
      "i hope this new chapter of your life",
      "is filled with the kind of happiness",
      "that stays long after the candles go out.",
      "may your dreams find their way to you,",
      "may your heart always feel at home,",
      "and may life be gentle with you",
      "in all the ways you deserve. 🤍"
    ],
    [
      "i honestly don’t know how to put",
      "everything i feel into words,",
      "but thank you for everything 🥹💓",
      "thank you for being you,",
      "for making me smile,",
      "and for making my little world",
      "a happier place to be."
    ],
    [
      "and honestly, i have a little weakness",
      "for the way you call me “Ayo” and “Madam”.",
      "i don’t think you realise how much",
      "i love those little names coming from you.",
      "they make even the simplest moments",
      "feel a little more special. 🥹🤍"
    ],
    [
      "if i could wish for one thing today,",
      "it would be to see you smile",
      "a thousand more times",
      "and to be there for every single one.",
      "in every little universe,",
      "in every lifetime,",
      "i think i’d still find my way to you. 🌙"
    ],
    [
      "thank you for being my favorite person",
      "and my most beautiful kind of magic."
    ],
    [
      "happy birthdayyyy 💖",
      "i hope this year loves you",
      "as much as i do 🫶🏻",
      "and never forget,",
      "this madam loves you so much. 🥹💓"
    ]
  ],

  // Photos are built into this file, so there is nothing else to upload.
  photos: [
    { data: "car", caption: "🤍", pos: "50% 72%" },
    { data: "rail", caption: "🤍", pos: "50% 40%" }
  ],

  roseMessage: "A rose for the one who owns my heart."
};
/* ===================================================== */

const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Fill in text
$('envLetterText').textContent = CONFIG.envelopeText;
$('letterTitle').textContent = CONFIG.title;
CONFIG.verses.forEach((lines, i) => {
  const p = document.createElement('p');
  if (i === CONFIG.verses.length - 1) p.className = 'finale';
  lines.forEach((line, j) => {
    if (j) p.appendChild(document.createElement('br'));
    p.appendChild(document.createTextNode(line));
  });
  $('letterBody').appendChild(p);
});
$('roseMsg').textContent = CONFIG.roseMessage;

// Photos (falls back to a pink heart if a photo is missing)
const placeholder = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#ffe3ea"/><path d="M50 74C30 58 24 48 24 39a13 13 0 0 1 26-4 13 13 0 0 1 26 4c0 9-6 19-26 35z" fill="#ffb3c6"/></svg>');
CONFIG.photos.forEach(p => {
  const fig = document.createElement('figure');
  fig.className = 'polaroid';
  const img = document.createElement('img');
  img.src = PHOTO_DATA[p.data]; img.alt = 'Photo'; img.style.objectPosition = p.pos || '50% 50%'; img.loading = 'lazy';
  img.onerror = () => { img.onerror = null; img.src = placeholder; };
  const cap = document.createElement('figcaption');
  cap.textContent = p.caption;
  fig.append(img, cap);
  $('gallery').appendChild(fig);
});

// Background floating hearts
if (!reduced) {
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('span');
    s.textContent = '♥';
    s.style.left = Math.random() * 100 + '%';
    s.style.fontSize = (12 + Math.random() * 22) + 'px';
    s.style.animationDuration = (9 + Math.random() * 10) + 's';
    s.style.animationDelay = (-Math.random() * 14) + 's';
    $('bgHearts').appendChild(s);
  }
}

// Envelope -> letter
let opened = false;
$('envelope').addEventListener('click', () => {
  if (opened) return;
  opened = true;
  $('envelope').classList.add('open');
  $('hint').style.visibility = 'hidden';
  setTimeout(() => {
    $('stage-envelope').classList.add('gone');
    setTimeout(() => {
      $('stage-envelope').style.display = 'none';
      $('stage-content').classList.add('show');
      window.scrollTo(0, 0);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        $('paper').classList.add('in');
      }));
      burstHearts(18);
    }, 800);
  }, reduced ? 300 : 2300);
});

// Falling things (petals / hearts)
function spawnFall(parent, html, color, size, dur) {
  const el = document.createElement('div');
  el.className = 'fall';
  el.innerHTML = html;
  el.style.left = Math.random() * 100 + '%';
  el.style.color = color;
  el.style.fontSize = size + 'px';
  el.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
  el.style.setProperty('--rot', (Math.random() * 540 - 270) + 'deg');
  el.style.animationDuration = dur + 's';
  parent.appendChild(el);
  setTimeout(() => el.remove(), dur * 1000 + 200);
}
function burstHearts(n, parent = document.body) {
  if (reduced) return;
  const colors = ['#e0425f', '#ffb3c6', '#ff7a9a', '#f9a8c0'];
  for (let i = 0; i < n; i++) {
    setTimeout(() => spawnFall(parent, '♥', colors[i % colors.length], 16 + Math.random() * 20, 3.5 + Math.random() * 2.5), i * 90);
  }
}

// Build the rose
function buildRose() {
  const svg = $('rose-svg');
  const NS = 'http://www.w3.org/2000/svg';
  let h = '';
  // stem
  h += '<path class="stem" d="M100 165 C 96 205, 106 245, 100 295" fill="none" stroke="#3f9a52" stroke-width="6" stroke-linecap="round"/>';
  // leaves
  h += '<g transform="translate(100 235)"><path class="leaf r" style="animation-delay:1.2s" d="M0 0 C 18 -22, 46 -22, 56 -10 C 44 8, 14 10, 0 0Z" fill="#4fb064" stroke="#2f7d42" stroke-width="1.5"/></g>';
  h += '<g transform="translate(100 205)"><path class="leaf l" style="animation-delay:1.4s" d="M0 0 C -18 -22, -46 -22, -56 -10 C -44 8, -14 10, 0 0Z" fill="#4fb064" stroke="#2f7d42" stroke-width="1.5"/></g>';
  // bloom
  h += '<g class="bloom"><g transform="translate(100 110)">';
  // sepals/back petals
  const layers = [
    { n: 6, off: 0,  cy: -30, rx: 34, ry: 44, fill: '#e0425f', stroke: '#a92042', delay: 1.8 },
    { n: 5, off: 30, cy: -24, rx: 28, ry: 36, fill: '#ea5873', stroke: '#b92a4a', delay: 2.3 },
    { n: 4, off: 15, cy: -18, rx: 21, ry: 27, fill: '#f27a91', stroke: '#c43a58', delay: 2.8 },
    { n: 3, off: 40, cy: -12, rx: 14, ry: 18, fill: '#f89ab0', stroke: '#cf4a68', delay: 3.2 }
  ];
  layers.forEach(L => {
    for (let i = 0; i < L.n; i++) {
      const a = L.off + i * (360 / L.n);
      h += `<g transform="rotate(${a})"><ellipse class="petal" style="animation-delay:${(L.delay + i * 0.07).toFixed(2)}s" cx="0" cy="${L.cy}" rx="${L.rx}" ry="${L.ry}" fill="${L.fill}" stroke="${L.stroke}" stroke-width="1.5"/></g>`;
    }
  });
  // heart of the rose
  h += '<circle class="bud" style="animation-delay:3.5s" cx="0" cy="-3" r="9" fill="#fbb5c6" stroke="#cf4a68" stroke-width="1.5"/>';
  h += '<path class="bud" style="animation-delay:3.6s" d="M-5 -4 C -2 -10, 6 -8, 4 -1 C 3 3, -3 3, -3 -1" fill="none" stroke="#cf4a68" stroke-width="1.5" stroke-linecap="round"/>';
  h += '</g></g>';
  svg.innerHTML = h;
}

let petalTimer, heartTimer;
function openRose() {
  buildRose();
  $('rose-overlay').classList.add('show');
  $('closeRose').focus();
  if (reduced) return;
  // sparkles of falling petals once the bloom is open
  setTimeout(() => {
    burstHearts(26, $('rose-overlay'));
    petalTimer = setInterval(() => {
      spawnFall($('rose-overlay'), '<svg width="16" height="22" viewBox="0 0 16 22"><path d="M8 0 C 18 8, 16 18, 8 22 C 0 18, -2 8, 8 0Z" fill="#ff8fab"/></svg>', '', 0, 5 + Math.random() * 3);
    }, 450);
    heartTimer = setInterval(() => burstHearts(3, $('rose-overlay')), 2200);
  }, 3600);
}
function closeRose() {
  $('rose-overlay').classList.remove('show');
  clearInterval(petalTimer); clearInterval(heartTimer);
  $('rose-svg').innerHTML = '';
  $('rose-overlay').querySelectorAll('.fall').forEach(e => e.remove());
  $('surpriseBtn').focus();
}
$('surpriseBtn').addEventListener('click', openRose);
$('closeRose').addEventListener('click', closeRose);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeRose(); });
</script>
</body>
</html>
